
services:
  # Python SfM & Processing Engine
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: ntro_backend
    ports:
      - "8000:8000"
    volumes:
      - ./docker/backend/src:/app/src
      - ./data:/app/data
    environment:
      - ENV=development

  # Node.js / Astro Dashboard
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: ntro_frontend
    ports:
      - "4321:4321"
    volumes:
      - ./docker/frontend/src:/app/src
      - ./docker/frontend/public:/app/public
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
